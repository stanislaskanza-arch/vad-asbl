<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VAD — Vision d'Assistance et de Développement | Lutte contre la pauvreté</title>
<link rel="icon" type="image/png" href="/images/logo-vad.png" />
<link rel="apple-touch-icon" href="/images/logo-vad.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --green-900:#064e3b; --green-800:#065f46; --green-700:#047857; --green-600:#059669; --green-100:#d1fae5;
    --gold:#d4af37; --gold-light:#f5d77a; --amber:#f59e0b;
    --ink:#0f172a; --slate:#475569; --muted:#94a3b8; --line:#e2e8f0;
    --bg:#f8fafc; --card:#ffffff; --danger:#dc2626; --blue:#2563eb;
    --radius:16px; --shadow:0 1px 2px rgba(15,23,42,.04),0 10px 30px rgba(15,23,42,.07); --shadow-lg:0 8px 40px rgba(15,23,42,.12);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg);line-height:1.6;-webkit-font-smoothing:antialiased}
  h1,h2,h3,h4{font-family:'Poppins','Inter',sans-serif}
  a{color:inherit;text-decoration:none}
  img,svg{display:block}
  .wrap{max-width:1180px;margin:0 auto;padding:0 20px}
  @keyframes fadeUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
  @keyframes floatUp{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  .reveal{animation:fadeUp .7s ease both}
  .btn{display:inline-flex;align-items:center;gap:8px;border:none;cursor:pointer;font-size:14px;font-weight:600;padding:12px 20px;border-radius:11px;transition:all .2s;font-family:inherit;letter-spacing:.2px}
  .btn-primary{background:linear-gradient(135deg,var(--green-600),var(--green-800));color:#fff;box-shadow:0 4px 14px rgba(5,150,105,.3)}.btn-primary:hover{filter:brightness(1.08);transform:translateY(-2px);box-shadow:0 6px 20px rgba(5,150,105,.4)}
  .btn-gold{background:linear-gradient(135deg,var(--gold),var(--amber));color:#3b2606;box-shadow:0 4px 14px rgba(212,175,55,.35)}.btn-gold:hover{filter:brightness(1.06);transform:translateY(-2px);box-shadow:0 6px 20px rgba(212,175,55,.45)}
  .btn-ghost{background:#fff;color:var(--green-800);border:1.5px solid var(--line)}.btn-ghost:hover{border-color:var(--green-600);color:var(--green-700);background:#f0fdf4}
  .btn-danger{background:#fee2e2;color:var(--danger)}.btn-danger:hover{background:#fecaca}
  .btn-sm{padding:7px 12px;font-size:13px}
  .btn:disabled{opacity:.6;cursor:not-allowed}
  .card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--line);transition:transform .25s,box-shadow .25s}
  .card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg)}
  .badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px}
  .badge-green{background:var(--green-100);color:var(--green-800)}
  .badge-gold{background:#fef3c7;color:#92400e}
  .badge-blue{background:#dbeafe;color:#1e40af}
  .badge-gray{background:#f1f5f9;color:var(--slate)}
  .input,.select,.textarea{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:11px;font-size:14px;font-family:inherit;background:#fff;color:var(--ink);transition:.2s}
  .input:focus,.select:focus,.textarea:focus{outline:none;border-color:var(--green-600);box-shadow:0 0 0 4px rgba(5,150,105,.12)}
  .label{display:block;font-size:13px;font-weight:600;color:var(--slate);margin-bottom:6px}
  .field{margin-bottom:14px}
  .grid{display:grid;gap:16px}
  .grid-2{grid-template-columns:repeat(2,1fr)}
  .grid-3{grid-template-columns:repeat(3,1fr)}
  .grid-4{grid-template-columns:repeat(4,1fr)}
  @media(max-width:880px){.grid-3,.grid-4{grid-template-columns:repeat(2,1fr)}.grid-2{grid-template-columns:1fr}}
  .muted{color:var(--muted)}.slate{color:var(--slate)}
  h1,h2,h3,h4{line-height:1.25}
  .section{padding:64px 0}
  /* ===== Public header ===== */
  .site-header{background:rgba(255,255,255,.85);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid rgba(226,232,240,.6);position:sticky;top:0;z-index:50;box-shadow:0 4px 24px rgba(15,23,42,.06)}
  .site-header .wrap{display:flex;align-items:center;justify-content:space-between;height:70px}
  .brand{display:flex;align-items:center;gap:12px;cursor:pointer}
  .brand-logo{width:44px;height:44px;flex-shrink:0}
  .brand-text b{font-size:18px;color:var(--green-900);letter-spacing:.5px}
  .brand-text span{display:block;font-size:11px;color:var(--muted);letter-spacing:.3px}
  .nav-links{display:flex;align-items:center;gap:24px}
  .nav-links a{font-size:14px;font-weight:500;color:var(--slate)}.nav-links a:hover{color:var(--green-700)}
  .nav-dropdown{position:relative}
  .nav-dropdown-toggle{display:flex;align-items:center;gap:4px;cursor:pointer;font-size:14px;font-weight:500;color:var(--slate);padding:6px 0}
  .nav-dropdown-toggle:hover{color:var(--green-700)}
  .nav-dropdown-toggle .caret{font-size:10px;transition:.2s}
  .nav-dropdown:hover .nav-dropdown-toggle .caret{transform:rotate(180deg)}
  .nav-dropdown-menu{position:absolute;top:100%;left:-10px;background:#fff;box-shadow:0 16px 40px rgba(15,23,42,.16);border-radius:14px;padding:8px;min-width:260px;border:1px solid var(--line);opacity:0;visibility:hidden;transform:translateY(10px);transition:.22s;z-index:60}
  .nav-dropdown:hover .nav-dropdown-menu{opacity:1;visibility:visible;transform:translateY(0)}
  .nav-dropdown-menu a{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:10px;font-size:14px;font-weight:500;color:var(--slate)}
  .nav-dropdown-menu a:hover{background:#f0fdf4;color:var(--green-700)}
  .nav-dropdown-menu a .mi{font-size:18px}
  .nav-sub-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--gold);padding:8px 14px 4px}
  @media(max-width:680px){.nav-links .hide-sm{display:none}}
  /* ===== Hero moderne avec image de fond ===== */
  .hero{position:relative;min-height:92vh;display:flex;align-items:center;color:#fff;overflow:hidden;background:linear-gradient(135deg,#064e3b,#047857);}
  .hero-bg{position:absolute;inset:0;background-image:url('/images/hero-solidarite.jpg');background-size:cover;background-position:center;transform:scale(1.05);}
  .hero-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,rgba(6,78,59,.92) 0%,rgba(4,78,57,.78) 45%,rgba(13,148,136,.55) 100%);}
  .hero .wrap{position:relative;z-index:2;padding:100px 20px;display:grid;grid-template-columns:1.15fr .85fr;gap:50px;align-items:center;width:100%;max-width:1180px;margin:0 auto}
  @media(max-width:900px){.hero .wrap{grid-template-columns:1fr;padding:70px 20px;text-align:center}.hero{min-height:auto}}
  .hero .eyebrow{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.14);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.25);color:#fff;font-size:13px;font-weight:600;padding:8px 16px;border-radius:999px;margin-bottom:22px}
  .hero h1{font-size:clamp(34px,5vw,56px);font-weight:800;line-height:1.1;letter-spacing:-1px;margin-bottom:20px;text-shadow:0 2px 30px rgba(0,0,0,.3)}
  .hero h1 .gold{color:var(--gold-light);background:linear-gradient(120deg,var(--gold-light),#fff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .hero p.lead{font-size:18px;opacity:.95;margin-bottom:30px;max-width:560px;line-height:1.7}
  @media(max-width:900px){.hero p.lead{margin-left:auto;margin-right:auto}}
  .hero .cta{display:flex;gap:14px;flex-wrap:wrap}
  @media(max-width:900px){.hero .cta{justify-content:center}}
  .hero-stats{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .hero-stat{background:rgba(255,255,255,.13);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.22);border-radius:18px;padding:22px;transition:.3s}
  .hero-stat:hover{transform:translateY(-6px);background:rgba(255,255,255,.2)}
  .hero-stat .num{font-family:'Poppins';font-size:30px;font-weight:800;color:var(--gold-light)}
  .hero-stat .lbl{font-size:13px;opacity:.9;margin-top:2px}
  @media(max-width:900px){.hero-stats{max-width:480px;margin:0 auto}}
  /* ===== Steps ===== */
  .step{padding:26px}
  .step .ico{width:54px;height:54px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:26px;background:linear-gradient(135deg,var(--green-100),#a7f3d0);color:var(--green-700);margin-bottom:16px;box-shadow:0 6px 18px rgba(5,150,105,.15)}
  .step h3{font-size:18px;margin-bottom:10px;font-weight:700}
  .step p{font-size:14.5px;color:var(--slate);line-height:1.65}
  /* ===== Table ===== */
  .table-wrap{overflow-x:auto}
  table.tbl{width:100%;border-collapse:collapse;font-size:14px}
  table.tbl th{text-align:left;padding:13px 14px;background:linear-gradient(180deg,#f8fafc,#f1f5f9);color:var(--green-900);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.5px;border-bottom:2px solid var(--line)}
  table.tbl td{padding:13px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
  table.tbl tr:hover td{background:#f0fdf4}
  table.tbl tr{cursor:pointer}
  /* ===== Charts ===== */
  .bars{display:flex;align-items:flex-end;gap:6px;height:180px;padding:10px 0 0}
  .bar-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
  .bar{width:100%;max-width:34px;border-radius:6px 6px 0 0;background:linear-gradient(var(--green-600),var(--green-700));transition:height .4s;position:relative;min-height:2px}
  .bar.gold{background:linear-gradient(var(--gold),var(--amber))}
  .bar.blue{background:linear-gradient(#60a5fa,#2563eb)}
  .bar-lbl{font-size:10.5px;color:var(--muted);margin-top:6px;white-space:nowrap}
  .bar-val{font-size:10px;color:var(--slate);margin-bottom:3px}
  .legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--slate);margin-top:10px}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
  /* ===== Admin layout ===== */
  .admin{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
  @media(max-width:880px){.admin{grid-template-columns:1fr}.sidebar{display:none}}
  .sidebar{background:linear-gradient(180deg,#064e3b,#022c22);color:#cbd5e1;padding:0;position:sticky;top:0;height:100vh;overflow-y:auto;box-shadow:4px 0 24px rgba(6,78,59,.15)}
  .sidebar .sb-brand{padding:22px 20px;border-bottom:1px solid rgba(255,255,255,.1);display:flex;align-items:center;gap:10px}
  .sidebar .sb-brand b{color:#fff;font-size:16px}
  .sidebar .sb-brand span{font-size:10.5px;color:var(--gold-light)}
  .nav-section{padding:6px 10px}
  .nav-section .ttl{font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;color:rgba(255,255,255,.4);padding:8px 12px;font-weight:700}
  .nav-group-header{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;border-radius:10px;font-size:13.5px;font-weight:700;color:#e2e8f0;cursor:pointer;transition:.2s;margin-bottom:2px;letter-spacing:.3px}
  .nav-group-header:hover{background:rgba(255,255,255,.08)}
  .nav-group-header .gh-left{display:flex;align-items:center;gap:9px}
  .nav-group-header .gh-ico{font-size:16px}
  .nav-group-header .gh-caret{font-size:11px;transition:transform .25s;color:rgba(255,255,255,.5)}
  .nav-group-header.collapsed .gh-caret{transform:rotate(180deg)}
  .nav-group-items{overflow:hidden;max-height:500px;transition:max-height .35s ease,opacity .25s;opacity:1}
  .nav-group-items.collapsed{max-height:0;opacity:0}
  .nav-group-items .nav-item{padding-left:22px}
  .nav-item{display:flex;align-items:center;gap:11px;padding:11px 14px;border-radius:10px;font-size:14px;color:#cbd5e1;cursor:pointer;font-weight:500;transition:.2s;margin-bottom:2px}
  .nav-item:hover{background:rgba(255,255,255,.1);color:#fff;transform:translateX(3px)}
  .nav-item.active{background:linear-gradient(135deg,rgba(212,175,55,.25),rgba(212,175,55,.12));color:#fff;box-shadow:inset 3px 0 0 var(--gold)}
  .nav-item .ic{font-size:16px;width:20px;text-align:center}
  .main-area{background:var(--bg);overflow-x:hidden}
  .topbar{background:rgba(255,255,255,.85);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid rgba(226,232,240,.6);padding:16px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:30;box-shadow:0 4px 20px rgba(15,23,42,.05)}
  .topbar h1{font-size:19px;color:var(--green-900)}
  .topbar .right{display:flex;align-items:center;gap:14px}
  .content{padding:24px;max-width:1200px}
  .kpi{background:#fff;border-radius:var(--radius);padding:22px;box-shadow:var(--shadow);border:1px solid var(--line);position:relative;overflow:hidden;transition:transform .25s,box-shadow .25s}
  .kpi:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
  .kpi::before{content:"";position:absolute;top:0;left:0;width:4px;height:100%;background:linear-gradient(var(--green-600),var(--green-800))}
  .kpi.gold::before{background:linear-gradient(var(--gold),var(--amber))}
  .kpi .lbl{font-size:12.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px;display:flex;align-items:center;gap:6px}
  .kpi .val{font-size:27px;font-weight:800;color:var(--green-900);margin-top:6px;letter-spacing:-.5px}
  .kpi .sub{font-size:12px;color:var(--slate);margin-top:3px}
  .kpi.gold .val{color:#92400e}
  .panel{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--line);padding:22px;margin-bottom:18px}
  .panel h3{font-size:16px;color:var(--green-900);margin-bottom:14px;display:flex;align-items:center;justify-content:space-between}
  .panel h3 .hint{font-size:12px;font-weight:400;color:var(--muted)}
  /* tabs */
  .tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin-bottom:18px;overflow-x:auto}
  .tab{padding:10px 16px;font-size:14px;font-weight:600;color:var(--slate);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;white-space:nowrap}
  .tab.active{color:var(--green-700);border-color:var(--green-600)}
  /* member tree */
  .tree-node{padding:10px 14px;border-radius:10px;background:#f8fafc;border:1px solid var(--line);margin-bottom:6px;display:flex;align-items:center;gap:10px}
  .tree-children{margin-left:24px;border-left:2px dashed var(--line);padding-left:14px;margin-bottom:6px}
  .avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--green-600),var(--green-800));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0}
  .avatar.gold{background:linear-gradient(135deg,var(--gold),var(--amber));color:#3b2606}
  /* login */
  .login-bg{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;position:relative;overflow:hidden;background:#064e3b}
  .login-bg::before{content:"";position:absolute;inset:0;background-image:url('/images/hero-solidarite.jpg');background-size:cover;background-position:center}
  .login-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(135deg,rgba(6,78,59,.94),rgba(13,148,136,.85))}
  .login-card{position:relative;z-index:2;background:rgba(255,255,255,.97);backdrop-filter:blur(20px);border-radius:22px;box-shadow:0 30px 80px rgba(0,0,0,.4);max-width:430px;width:100%;padding:42px;border:1px solid rgba(255,255,255,.4)}
  .alert{padding:12px 14px;border-radius:10px;font-size:13.5px;margin-bottom:16px}
  .alert-error{background:#fee2e2;color:var(--danger);border:1px solid #fecaca}
  .alert-success{background:var(--green-100);color:var(--green-800);border:1px solid var(--green-100)}
  .share-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-top:14px}
  .share-btn{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 8px;border-radius:12px;border:1.5px solid var(--line);background:#fff;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--slate);transition:.15s}
  .share-btn:hover{border-color:var(--green-600);color:var(--green-700);transform:translateY(-2px)}
  .share-btn .ic{font-size:24px}
  .stat-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
  .stat-row:last-child{border:none}
  .stat-row b{color:var(--green-900)}
  .footer-link{color:var(--green-700);font-weight:600;cursor:pointer}
  .footer-link:hover{text-decoration:underline}
  .spinner{display:inline-block;width:18px;height:18px;border:2.5px solid var(--green-100);border-top-color:var(--green-600);border-radius:50%;animation:sp .7s linear infinite}

  /* ===== SLIDER / CARROUSEL ===== */
  .slider{position:relative;border-radius:20px;overflow:hidden;box-shadow:var(--shadow-lg);max-width:920px;margin:0 auto}
  .slider-track{display:flex;transition:transform .7s cubic-bezier(.4,0,.2,1)}
  .slide{min-width:100%;position:relative}
  .slide img{width:100%;height:400px;object-fit:cover;display:block}
  @media(max-width:880px){.slide img{height:240px}}
  .slide-caption{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(6,78,59,.95));color:#fff;padding:60px 32px 30px}
  @media(max-width:880px){.slide-caption{padding:30px 18px 18px}}
  .slide-caption h3{font-family:'Poppins';font-size:24px;margin-bottom:6px;font-weight:700;text-shadow:0 2px 12px rgba(0,0,0,.4)}
  @media(max-width:880px){.slide-caption h3{font-size:17px}}
  .slide-caption p{font-size:14px;opacity:.92;text-shadow:0 1px 8px rgba(0,0,0,.4)}
  .slider-arrow{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.92);border:none;cursor:pointer;font-size:22px;display:flex;align-items:center;justify-content:center;z-index:5;box-shadow:0 4px 16px rgba(0,0,0,.25);transition:.2s;color:var(--green-900)}
  .slider-arrow:hover{background:#fff;transform:translateY(-50%) scale(1.08)}
  .slider-arrow.prev{left:16px}.slider-arrow.next{right:16px}
  @media(max-width:880px){.slider-arrow{width:38px;height:38px;font-size:18px}.slider-arrow.prev{left:8px}.slider-arrow.next{right:8px}}
  .slider-dots{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:5}
  .slider-dot{width:11px;height:11px;border-radius:50%;background:rgba(255,255,255,.5);border:none;cursor:pointer;transition:.3s;padding:0}
  .slider-dot.active{background:var(--gold-light);width:30px;border-radius:6px}

  /* ===== OPTIMISATION MOBILE ===== */
  .hamburger{display:none;background:none;border:none;cursor:pointer;width:44px;height:44px;border-radius:10px;align-items:center;justify-content:center;font-size:24px;color:var(--green-800)}
  .hamburger:hover{background:rgba(5,150,105,.1)}
  /* Overlay sombre derrière le menu mobile */
  .mobile-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:90}
  .mobile-backdrop.show{display:block}
  /* Menu public mobile (dropdown) */
  .nav-mobile{display:none;position:fixed;top:70px;left:0;right:0;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 12px 30px rgba(0,0,0,.15);z-index:45;padding:8px 0;flex-direction:column}
  .nav-mobile.show{display:flex}
  .nav-mobile a{padding:14px 24px;font-size:15px;font-weight:600;color:var(--green-900);border-left:3px solid transparent}
  .nav-mobile a:hover{background:#f0fdf4;border-left-color:var(--green-600)}
  /* Sidebar admin en overlay mobile */
  @media(max-width:880px){
    .hamburger{display:flex}
    .sidebar{display:none;position:fixed;top:0;left:0;width:280px;z-index:100;box-shadow:8px 0 40px rgba(0,0,0,.4);animation:slideIn .25s ease}
    .sidebar.show{display:block}
    .admin{grid-template-columns:1fr}
    .nav-links{display:none}
    .content{padding:16px}
    .topbar{padding:12px 16px}
    .topbar h1{font-size:17px}
    /* grilles -> 1 colonne */
    .grid-2,.grid-3,.grid-4{grid-template-columns:1fr !important;gap:12px}
    /* KPI plus compacts */
    .kpi{padding:16px}.kpi .val{font-size:23px}

<body>
<div id="app"></div>

<script>
"use strict";
/* ============================================================
   VAD — Application monopage (vanilla JS)
   ============================================================ */
const API = '/api';
const USD_RATE = 2850; // 1 USD ≈ 2850 CDF
const state = {
  token: localStorage.getItem('vad_token'),
  user: JSON.parse(localStorage.getItem('vad_user') || 'null'),
  cur: localStorage.getItem('vad_cur') || 'CDF',
  content: {},
};

/* ---------- utilitaires ---------- */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = (n) => Number(n||0).toLocaleString('fr-FR');
function money(n, cur){
  n = Number(n||0);
  if (cur === 'USD' || (cur===undefined && state.cur==='USD')){
    return (n/USD_RATE).toLocaleString('fr-FR',{maximumFractionDigits:2}) + ' $';
  }
  return fmt(n) + ' CDF';
}
function shortMoney(n){
  n = Number(n||0);
  if (state.cur==='USD'){ n = n/USD_RATE; }
  if (Math.abs(n) >= 1e9) return (n/1e9).toFixed(1)+' Md';
  if (Math.abs(n) >= 1e6) return (n/1e6).toFixed(1)+' M';
  if (Math.abs(n) >= 1e3) return (n/1e3).toFixed(0)+' k';
  return fmt(Math.round(n));
}
function fmtDate(d){ try{ return new Date(d).toLocaleDateString('fr-FR',{day:'2-digit',month:'short',year:'numeric'}); }catch{ return '—'; } }
function fmtDateTime(d){ try{ return new Date(d).toLocaleString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}); }catch{ return '—'; } }
function initials(a,b){ return ((a||'?')[0]+(b||'?')[0]).toUpperCase(); }
function loading(msg='Chargement…'){ return `<div class="loading"><span class="spinner"></span>${msg}</div>`; }

/* ---------- API ---------- */
async function api(path, opts={}, {raw=false}={}){
  const headers = {'Content-Type':'application/json', ...(opts.headers||{})};
  if (state.token) headers.Authorization = 'Bearer '+state.token;
  let res;
  try{
    res = await fetch(API+path, {...opts, headers});
  }catch(e){ throw new Error('Connexion au serveur impossible'); }
  const data = await res.json().catch(()=>({}));
  if (res.status === 401 && state.token){ state.token=null; state.user=null; localStorage.removeItem('vad_token'); localStorage.removeItem('vad_user'); location.hash='/login'; throw new Error('Session expirée. Reconnectez-vous.'); }
  if (!res.ok) throw new Error(data.error || ('Erreur '+res.status));
  return data;
}
function saveAuth(token, user){ state.token=token; state.user=user; localStorage.setItem('vad_token',token); localStorage.setItem('vad_user',JSON.stringify(user)); }
function logout(){ state.token=null; state.user=null; localStorage.removeItem('vad_token'); localStorage.removeItem('vad_user'); location.hash='/'; }

/* ---------- logo VAD (emblème carte d'Afrique + texte) ---------- */
function logo(size=44){
  return `<img src="/images/logo-vad.png" alt="Logo VAD" width="${size}" height="${size}" style="width:${size}px;height:${size}px;object-fit:contain;flex-shrink:0;border-radius:50%" onerror="this.style.display='none'"/>`;
}

/* ============================================================
   ROUTEUR
   ============================================================ */
// ---- Gestion du contenu (images + textes modifiables) ----
async function loadContent(){
  try { state.content = await api('/content/all'); } catch(e){ state.content = {}; }
}
function img(file){
  const k = 'img.' + file.replace(/\.(jpg|jpeg|png|gif|webp)$/i, '');
  return state.content[k] || ('/images/' + file);
}
function txt(key, def){ return state.content['txt.'+key] || def; }

// Page: Images du site
async function viewContentImages(){
  return adminShell('/admin/contenu/images', (async()=>{
    const data = await api('/content/images');
    return `${topbar('🖼️ Images du site', '')}
    <div class="content">
      <div class="panel"><p class="slate" style="font-size:14px">Remplacez les images du site. Cliquez sur <b>« Changer »</b>, sélectionnez une nouvelle image sur votre appareil. La modification est immédiate et persistante.</p></div>
      <div class="grid grid-2">
        ${data.items.map(im => `<div class="panel">
          <h3>${im.label} <span class="badge ${im.overridden?'badge-gold':'badge-gray'}" style="font-size:11px">${im.overridden?'Modifiée':'Par défaut'}</span></h3>
          <div class="muted" style="font-size:12px;margin-bottom:10px">${im.section} · <span class="mono">${im.file}</span></div>
          <div style="margin-bottom:14px;border-radius:12px;overflow:hidden;border:1px solid var(--line)"><img src="${img(im.file)}" alt="${im.label}" style="width:100%;height:160px;object-fit:cover;display:block"/></div>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <label class="btn btn-primary btn-sm" style="cursor:pointer">📁 Changer<input type="file" accept="image/*" style="display:none" data-imgkey="${im.key}"></label>
            ${im.overridden?`<button class="btn btn-ghost btn-sm" data-imgreset="${im.key}">↩️ Réinitialiser</button>`:''}
          </div>
          <div data-imgmsg="${im.key}" style="margin-top:8px"></div>
        </div>`).join('')}
      </div>
    </div>`;
  })());
}

// Page: Textes du site
let txtSection = '';
async function viewContentTexts(){
  return adminShell('/admin/contenu/textes', (async()=>{
    const data = await api('/content/texts');
    // Remplir les valeurs par defaut avec le contenu actuel du site
    const defs = {};
    if(typeof ACTIVITIES!=='undefined'){ Object.keys(ACTIVITIES).forEach(function(k){ var a=ACTIVITIES[k]; defs['txt.activity.'+k+'.intro']=a.intro; if(a.sections){a.sections.forEach(function(s,i){defs['txt.activity.'+k+'.s'+(i+1)]=s.p;});} }); }
    defs['txt.president.message']="Chers membres et partenaires de Vision d Assistance et de Developpement (VAD),\n\nC est avec un grand honneur que je m adresse a vous en ma qualite de Coordonnateur National. Notre association, nee de la volonte de lutter contre la pauvrete, oeuvre chaque jour dans la region sub-saharienne pour apporter un changement durable dans la vie des communautes les plus vulnerables.\n\nEnsemble, vainquons la pauvrete !\n\nBien fraternellement,\nKANZA NZINU Stanislas\nCoordonnateur National, VAD";
    defs['txt.mission.intro']="Vision d Assistance et de Developpement (VAD) a pour mission principale la lutte contre la pauvrete. Cette lutte passe par l ensemble d activites que l ASBL VAD organise.";
    defs['txt.genes']="Tout est parti d un constat : la pauvrete frappe durement les populations d Afrique sub-saharienne. Face a cette realite, KANZA NZINU Stanislas et un groupe de personnes engagees ont concu une idee : creer une association ou la solidarite deviendrait un veritable levier contre la pauvrete.";
    data.items.forEach(function(i){ if(!i.value && defs[i.key]){ i.value=defs[i.key]; } });
    const sections = [...new Set(data.items.map(i=>i.section))];
    if(!txtSection) txtSection = sections[0] || '';
    const tabs = sections.map(s=>`<div class="tab ${s===txtSection?'active':''}" data-txtsec="${s}">${s}</div>`).join('');
    const fields = data.items.filter(i=>i.section===txtSection).map(i=>`
      <div class="panel">
        <label class="label">${i.label}</label>
        <textarea class="textarea" rows="${i.type==='textarea'?6:2}" data-txtkey="${i.key}">${esc(i.value||'')}</textarea>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px">
          <span class="muted" style="font-size:12px">${i.value?'Modifié':'Vide = texte par défaut'}</span>
          <button class="btn btn-primary btn-sm" data-txtsave="${i.key}">💾 Enregistrer</button>
        </div>
        <div data-txtfieldmsg="${i.key}" style="margin-top:6px"></div>
      </div>`).join('');
    return `${topbar('📝 Textes du site', '')}
    <div class="content">
      <div class="panel"><p class="slate" style="font-size:14px">Modifiez les textes du site. Les champs vides utilisent le texte par défaut. Pensez à <b>enregistrer</b> chaque texte.</p></div>
      <div class="tabs">${tabs}</div>
      ${fields}
    </div>`;
  })());
}

// Upload d'image
function bindImageUploads(){
  $$('[data-imgkey]').forEach(inp=>{
    inp.onchange = async (e)=>{
      const file = e.target.files[0]; const key = inp.dataset.imgkey;
      if(!file) return;
      const msg = $(`[data-imgmsg="${key}"]`);
      msg.innerHTML = '<span class="muted">⏳ Chargement...</span>';
      if(file.size > 2000000){ msg.innerHTML='<div class="alert alert-error">Image trop volumineuse (max 2 Mo)</div>'; return; }
      const reader = new FileReader();
      reader.onload = async ()=>{
        try {
          await api('/content/image', {method:'POST', body:JSON.stringify({key, base64:reader.result})});
          msg.innerHTML = '<div class="alert alert-success">✅ Image mise à jour !</div>';
          await loadContent(); setTimeout(()=>dispatch(), 800);
        } catch(err){ msg.innerHTML = '<div class="alert alert-error">⚠️ '+err.message+'</div>'; }
      };
      reader.readAsDataURL(file);
    };
  });
  $$('[data-imgreset]').forEach(btn=>{
    btn.onclick = async ()=>{
      const key = btn.dataset.imgreset;
      try { await api('/content/image/reset', {method:'POST', body:JSON.stringify({key})}); await loadContent(); dispatch(); }
      catch(e){ alert(e.message); }
    };
  });
}
// Sauvegarde de texte
function bindTextSaves(){
  $$('[data-txtsec]').forEach(t=>t.onclick=()=>{ txtSection=t.dataset.txtsec; dispatch(); });
  $$('[data-txtsave]').forEach(btn=>{
    btn.onclick = async ()=>{
      const key = btn.dataset.txtsave;
      const ta = $(`[data-txtkey="${key}"]`);
      const msg = $(`[data-txtfieldmsg="${key}"]`);
      btn.disabled=true; btn.textContent='⏳...';
      try {
        await api('/content/text', {method:'POST', body:JSON.stringify({key, value: ta.value})});
        msg.innerHTML = '<div class="alert alert-success">✅ Enregistré</div>';
        await loadContent();
      } catch(err){ msg.innerHTML = '<div class="alert alert-error">⚠️ '+err.message+'</div>'; }
      btn.disabled=false; btn.textContent='💾 Enregistrer';
    };
  });
}

const routes = [];
function r(path, fn){ routes.push({path, fn}); }
async function dispatch(){
  const app = $('#app');
  let hash = location.hash.slice(1) || '/';
  // protéger /admin
  if (hash.startsWith('/admin') && !state.token){ location.hash='/login'; return; }
  app.innerHTML = loading();
  window.scrollTo(0,0);
  try{
    for (const route of routes){
      const m = matchRoute(route.path, hash);
      if (m){ app.innerHTML = await route.fn(m.params); afterRender(); return; }
    }
    app.innerHTML = notFound();
  }catch(e){
    app.innerHTML = `<div class="wrap" style="padding:40px"><div class="alert alert-error">⚠️ ${esc(e.message)}</div><a class="footer-link" href="#/">← Retour à l'accueil</a></div>`;
  }
}
function matchRoute(pattern, path){
  const pp = pattern.split('/'), hp = path.split('/');
  if (pp.length !== hp.length) return null;
  const params = {};
  for (let i=0;i<pp.length;i++){
    if (pp[i].startsWith(':')) params[pp[i].slice(1)] = decodeURIComponent(hp[i]);
    else if (pp[i] !== hp[i]) return null;
  }
  return {params};
}
window.addEventListener('hashchange', dispatch);

/* ============================================================
   COMPOSANTS
   ============================================================ */
function kpi(label, value, sub, icon, cls=''){
  return `<div class="kpi ${cls}"><div class="lbl">${icon||''} ${esc(label)}</div><div class="val">${value}</div>${sub?`<div class="sub">${sub}</div>`:''}</div>`;
}
function barChart(items, {valueKey='v', labelKey='l', color='', maxVal}={}){
  const max = maxVal || Math.max(1, ...items.map(i=>Number(i[valueKey])||0));
  const bars = items.map(i=>{
    const v = Number(i[valueKey])||0;
    return `<div class="bar-col"><div class="bar-val">${shortMoney(v)}</div><div class="bar ${color}" style="height:${Math.max(2,(v/max)*100)}%" title="${esc(i[labelKey])}: ${fmt(v)}"></div><div class="bar-lbl">${esc(i[labelKey])}</div></div>`;
  }).join('');
  return `<div class="bars">${bars}</div>`;
}
function lineChart(series, labels){
  // series: [{name,color,values:[]}] labels:[]
  const W=560,H=200,P=30;
  const allVals = series.flatMap(s=>s.values);
  const max = Math.max(1, ...allVals);
  const min = Math.min(0, ...allVals);
  const xStep = (W-2*P)/Math.max(1,labels.length-1);
  const y = v => H-P-((v-min)/(max-min||1))*(H-2*P);
  const x = i => P+i*xStep;
  let grid='';for(let g=0;g<=4;g++){const yy=P+g*(H-2*P)/4;grid+=`<line x1="${P}" y1="${yy}" x2="${W-P}" y2="${yy}" stroke="#e2e8f0" stroke-width="1"/>`;}
  let xlabels = labels.map((l,i)=>`<text x="${x(i)}" y="${H-8}" font-size="10" fill="#94a3b8" text-anchor="middle">${esc(l)}</text>`).join('');
  let lines = series.map(s=>{
    const pts = s.values.map((v,i)=>`${x(i)},${y(v)}`).join(' ');
    const area = s.values.length? `<polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="2.5"/>`:'';
    const dots = s.values.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="3" fill="${s.color}"/>`).join('');
    return area+dots;
  }).join('');
  const legend = `<div class="legend">${series.map(s=>`<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join('')}</div>`;
  return `<div style="overflow-x:auto"><svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px;min-width:420px">${grid}${xlabels}${lines}</svg></div>${legend}`;
}
function pagination(meta, base){
  if(!meta||meta.pages<=1) return '';
  let btns='';
  for(let i=1;i<=meta.pages;i++){ btns+=`<button class="${i===meta.page?'active':''}" data-pg="${i}">${i}</button>`; }
  return `<div class="pg">${btns}</div>`;
}

    {k:'email',ic:'✉️',label:'E-mail'},

  return `<div class="share-grid">${items.map(i=>`<a class="share-btn" href="${esc(links[i.k]||'#')}" target="_blank" rel="noopener"><span class="ic">${i.ic}</span>${i.label}</a>`).join('')}</div>`;

      return '<div class="nav-section"><div class="nav-group-header '+'open'+'" data-grp="'+sec.s+'"><span class="gh-left"><span class="gh-ico">'+sec.icon+'</span>'+sec.s+'</span><span class="gh-caret">▼</span></div><div class="nav-group-items">'+sec.items.map(it=>'<a class="nav-item '+(active===it[1]?'active':'')+'" href="#'+it[1]+'"><span class="ic">'+it[2]+'</span>'+it[0]+'</a>').join('')+'</div></div>';

  </aside>`;

  let content = loading('Chargement…');
  const main = `<div class="main-area"><div id="adminContent">${content}</div></div>`;
  const html = `<div class="admin">${sidebar}${main}</div>`;

function topbar(title, right=''){
  const curToggle = `<div style="display:flex;gap:4px;background:#f1f5f9;padding:3px;border-radius:8px">
    <button class="btn btn-sm ${state.cur==='CDF'?'btn-primary':'btn-ghost'}" data-cur="CDF" style="padding:5px 10px">CDF</button>
    <button class="btn btn-sm ${state.cur==='USD'?'btn-primary':'btn-ghost'}" data-cur="USD" style="padding:5px 10px">USD</button>
  </div>`;
  return `<div class="topbar"><button class="hamburger" id="adminBurger" aria-label="Menu" style="margin-right:8px">☰</button><h1>${title}</h1><div class="right">${curToggle}<div style="text-align:right;font-size:13px"><b>${esc(state.user?.firstName||'')} ${esc(state.user?.lastName||'')}</b><div class="muted" style="font-size:11px">${esc(state.user?.username||'')}</div></div><div class="avatar">${initials(state.user?.firstName,state.user?.lastName)}</div></div></div>
  <div class="mobile-backdrop" id="adminBackdrop"></div>`;
}

/* ---------- Dashboard ---------- */
async function viewDashboard(){
  return adminShell('/admin', (async()=>{
    const [s, fin, mstats] = await Promise.all([
      api('/dashboard/stats'),
      api('/stats/finances'),
      api('/stats/members'),
    ]);
    const monthsLbl = ['Jan','Fév','Mar','Avr','Mai','Juin','Juil','Août','Sep','Oct','Nov','Déc'];
    const flcpBars = fin.monthly.map((m,i)=>({v:m.flcp,l:monthsLbl[i]}));
    const regBars = mstats.monthly.map((m,i)=>({v:m.count,l:monthsLbl[i]}));
    const recent = s.recentMembers||[];
    return `${topbar('Tableau de bord')}
    <div class="content">
      <div class="grid grid-4">
        ${kpi('Membres', fmt(s.totalMembers), `${s.activeMembers} actifs`, '👥')}
        ${kpi('Trésorerie', shortMoney(s.totalTreasury), money(s.totalTreasury), '🏦','gold')}
        ${kpi('FLCP collecté', money(s.totalFlcp), `${fmt(s.flcpCount)} cotisations`, '💵')}
        ${kpi('AIP crédité', money(s.aipTotalCredited), 'Reversé aux parrains (30%)', '📈')}
      </div>
      <div class="grid grid-2" style="margin-top:18px">
        <div class="panel"><h3>💵 Cotisations FLCP mensuelles <span class="hint">${new Date().getFullYear()}</span></h3>${barChart(flcpBars)}</div>
        <div class="panel"><h3>👥 Nouveaux membres / mois <span class="hint">${new Date().getFullYear()}</span></h3>${barChart(regBars,{color:'gold'})}</div>
      </div>
      <div class="grid grid-3" style="margin-top:18px">
        <div class="panel"><h3>📊 Vue d'ensemble</h3>
          <div class="stat-row"><span>Subventions, dons & legs</span><b>${money(s.totalThirdParty)}</b></div>
          <div class="stat-row"><span>AIP en comptes (solde)</span><b>${money(s.aipBalance)}</b></div>
          <div class="stat-row"><span>Membres parrainés</span><b>${fmt(s.sponsoredCount)}</b></div>
          <div class="stat-row"><span>Membres sans parrain</span><b>${fmt(s.totalMembers - s.sponsoredCount)}</b></div>
          <div class="stat-row"><span>Membre H/F</span><b>${mstats.gender.male} H / ${mstats.gender.female} F</b></div>
        </div>
        <div class="panel" style="grid-column:span 2"><h3>🆕 Membres récents</h3>
          ${recent.length?`<div class="table-wrap"><table class="tbl"><thead><tr><th>N° adhérent</th><th>Nom</th><th>Ville</th><th>Inscription</th></tr></thead><tbody>${recent.map(m=>`<tr data-href="#/admin/members/${m.id}"><td class="mono">${esc(m.membershipNumber)}</td><td><span class="avatar" style="width:28px;height:28px;font-size:11px;display:inline-flex;margin-right:8px">${initials(m.firstName,m.lastName)}</span>${esc(m.firstName)} ${esc(m.lastName)}</td><td>${esc(m.city||'—')}</td><td>${fmtDate(m.registrationDate)}</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty"><div class="ic">👥</div>Aucun membre</div>`}
        </div>

async function viewSponsors(){

      const kids = (n.children||[]).map(c=>`<div class="tree-children">${renderNode(c,depth+1)}</div>`).join('');
      return `<div class="tree-node" data-href="#/admin/members/${n.id}" style="${depth===0?'background:linear-gradient(90deg,#f0fdf4,#fff);border-color:var(--green-100)':''}">
        <div class="avatar ${depth===0?'gold':''}">${initials(n.firstName,n.lastName)}</div>

        ${n._count?.sponsored?`<span class="badge badge-blue">${n._count.sponsored} filleul${n._count.sponsored>1?'s':''}</span>`:''}
        ${n.aipAccount?.balance?`<span class="badge badge-gold">AIP ${money(n.aipAccount.balance)}</span>`:''}
      </div>${kids}`;
    }
    return `${topbar('Parrains & Arbre de parrainage')}<div class="content">
      <div class="panel"><h3>🏆 Classement des parrains</h3>

/* ============================================================
   ÉVÉNEMENTS (délégution après rendu)
   ============================================================ */
function afterRender(){
  // accordéon sidebar admin
  $$(".nav-group-header").forEach(function(h){ h.onclick=function(){ h.classList.toggle("collapsed"); if(h.nextElementSibling) h.nextElementSibling.classList.toggle("collapsed"); }; });
  // logout
  const lo = $('#logoutBtn'); if(lo) lo.onclick = logout;
  // devise
  $$('[data-cur]').forEach(b=>b.onclick=()=>{ state.cur=b.dataset.cur; localStorage.setItem('vad_cur',state.cur); dispatch(); });
  // lignes de tableau cliquables
  $$('[data-href]').forEach(el=>{ el.onclick=()=>{ location.hash = el.dataset.href; }; });
  // copy
  $$('[data-copy]').forEach(b=>{ b.onclick=async()=>{ try{ await navigator.clipboard.writeText(b.dataset.copy); const t=b.textContent; b.textContent='✓ Copié'; setTimeout(()=>b.textContent=t,1500);}catch(e){} }; });
  // pagination membres
  $$('[data-pg]').forEach(b=>b.onclick=()=>{ membersPage=Number(b.dataset.pg); dispatch(); });
  // recherche membres
  const ms = $('#memberSearch'); if(ms){ let t; ms.oninput=(e)=>{ clearTimeout(t); t=setTimeout(()=>{ membersQ=e.target.value.trim(); membersPage=1; dispatch(); },350); }; }
  // tabs finances
  $$('[data-ftab]').forEach(t=>t.onclick=()=>{ finTab=t.dataset.ftab; dispatch(); });
  // rapports (période)
  const rp=$('#repPeriod'); if(rp){ rp.onchange=runReport; $('#repYear').onchange=runReport; $('#repMonth').onchange=runReport; $('#repQuarter').onchange=runReport; toggleRepSelects(); }
  // formulaire login
  const lf=$('#loginForm'); if(lf) lf.onsubmit=handleLogin;
  // formulaire join
  const jf=$('#joinForm'); if(jf) jf.onsubmit=handleJoin;
  // formulaire membre
  const mf=$('#memberForm'); if(mf) mf.onsubmit=handleMemberCreate;
  // formulaire FLCP
  const ff=$('#flcpForm'); if(ff) ff.onsubmit=handleFlcp;
  // formulaire tiers
  const tf=$('#tiersForm'); if(tf) tf.onsubmit=handleTiers;
  // parrainage select
  const rfs=$('#refMember'); if(rfs) rfs.onchange=handleRefSelect;
  // cotisation en ligne
  const df=$('#declareForm'); if(df) df.onsubmit=handleDeclarePayment;
  const pms=$('#payMethodSel'); if(pms) pms.onchange=showPayInstruction;
  // slider carrousel (page accueil)
  if($('#vadSlider')) initSlider();
  if(document.querySelector("[data-imgkey]")) bindImageUploads();
  const hb=document.querySelector("[data-herobg]"); if(hb && state.content["img.hero-solidarite"]){hb.style.backgroundImage="url("+state.content["img.hero-solidarite"]+")";}
  if(document.querySelector("[data-txtsave]")) bindTextSaves();
  // formulaire contact
  const cf=$('#contactForm'); if(cf) cf.onsubmit=handleContact;
  // menus hamburger mobile
  const pb=$('#publicBurger'); const nm=$('#navMobile'); const nbk=$('#navBackdrop');
  if(pb){ pb.onclick=()=>{ nm.classList.toggle('show'); nbk.classList.toggle('show'); };
    nbk.onclick=()=>{ nm.classList.remove('show'); nbk.classList.remove('show'); };
    if(nm) nm.querySelectorAll('a').forEach(a=>a.onclick=()=>{ nm.classList.remove('show'); nbk.classList.remove('show'); });
  }
  const ab=$('#adminBurger'); const asb=$('#adminSidebar'); const abk=$('#adminBackdrop');
  if(ab){ ab.onclick=()=>{ asb.classList.toggle('show'); abk.classList.toggle('show'); };
    abk.onclick=()=>{ asb.classList.remove('show'); abk.classList.remove('show'); };
    if(asb) asb.querySelectorAll('.nav-item').forEach(it=>it.onclick=()=>{ asb.classList.remove('show'); abk.classList.remove('show'); });
  }
}
function toggleRepSelects(){
  const p=$('#repPeriod'); if(!p) return;
  $('#repMonth').style.display = p.value==='monthly'?'':'none';
  $('#repQuarter').style.display = p.value==='quarterly'?'':'none';
}
async function runReport(){
  const period=$('#repPeriod').value, year=$('#repYear').value;
  const month=$('#repMonth').value, quarter=$('#repQuarter').value;
  const qs = `period=${period}&year=${year}${period==='monthly'?'&month='+month:''}${period==='quarterly'?'&quarter='+quarter:''}`;
  const monthsLbl=['Jan','Fév','Mar','Avr','Mai','Juin','Juil','Août','Sep','Oct','Nov','Déc'];
  try{
    const rep = await api('/finances/report?'+qs);
    // reconstruire la zone rapport
    const html = `<div class="grid grid-4">${kpi('FLCP total',money(rep.totalFlcp),`${rep.flcpCount} cotisations`,'💵')}${kpi('AIP (30%)',money(rep.totalAip),'Crédité aux parrains','📈','gold')}${kpi('Trésor FLCP (70%)',money(rep.treasuryFlcp),'Part commune','🏦')}${kpi('TRÉSOR TOTAL',money(rep.totalTreasury),'+ tiers','🏦')}</div>
      <div class="grid grid-2" style="margin-top:8px">${kpi('Contributions de tiers',money(rep.totalThirdParty),'Subventions + dons + legs','🎁')}${kpi('Toutes cotisations',money(rep.totalContributions),'','💰')}</div>
      <div class="panel" style="margin-top:18px;box-shadow:none;background:#f8fafc"><h4 style="margin-bottom:10px;color:var(--green-900)">Évolution mensuelle ${rep.year}</h4>${barChart(rep.monthly.map(m=>({v:m.flcp,l:m.label})))}</div>
      <div class="table-wrap" style="margin-top:14px"><table class="tbl"><thead><tr><th>Mois</th><th>FLCP</th><th>AIP 30%</th><th>Trésor 70%</th><th>Tiers</th><th>Trésor total</th></tr></thead><tbody>${rep.monthly.map(m=>`<tr><td>${m.label}</td><td>${money(m.flcp)}</td><td>${money(m.aip)}</td><td>${money(m.treasuryFlcp)}</td><td>${money(m.thirdParty)}</td><td><b>${money(m.totalTreasury)}</b></td></tr>`).join('')}</tbody></table></div>`;
    const zone=$('#reportZone'); if(zone) zone.innerHTML=html;
  }catch(e){ alert(e.message); }
}
async function handleLogin(e){ e.preventDefault(); const f=new FormData(e.target); const msg=$('#loginMsg'); msg.innerHTML=''; const btn=e.target.querySelector('button[type=submit]'); const old=btn.textContent; btn.disabled=true; btn.innerHTML='<span class="spinner"></span> Connexion…';
  try{ const r=await api('/auth/login',{method:'POST',body:JSON.stringify({username:f.get('username'),password:f.get('password')})}); saveAuth(r.token,r.user); location.hash='/admin'; }
  catch(err){ msg.innerHTML=`<div class="alert alert-error">⚠️ ${esc(err.message)}</div>`; btn.disabled=false; btn.textContent=old; }
}
function handleJoin(e){ e.preventDefault(); const msg=$('#joinMsg'); msg.innerHTML=`<div class="alert alert-success">🎉 Merci ! Votre demande d'adhésion a bien été enregistrée.<br><br>Un responsable de la VAD vous contactera sous peu pour finaliser votre inscription (numéro de membre, FLCP et lien de parrainage). 📞</div>`; e.target.reset(); window.scrollTo({top:0,behavior:'smooth'}); }

// Instructions dynamiques selon le moyen de paiement choisi
function showPayInstruction(){
  const sel=$('#payMethodSel'); const zone=$('#payInstruction'); if(!sel||!zone) return;
  const m = sel.value;
  if(!m){ zone.style.display='none'; return; }
  const labels = { bank_transfer:'🏦 Virement bancaire', mpesa:'📱 M-Pesa', orange_money:'🟠 Orange Money', airtel_money:'🔴 Airtel Money' };
  const numSel = { bank_transfer:'payment.bank_account_number', mpesa:'payment.mpesa_number', orange_money:'payment.orange_number', airtel_money:'payment.airtel_number' };
  zone.style.display='block';
  zone.innerHTML = `<div class="alert" style="background:#eff6ff;border:1px solid #bfdbfe;color:#1e40af"><b>${labels[m]}</b><br>Effectuez le paiement vers le numéro/compte indiqué ci-dessus, puis saisissez ci-dessous le <b>code de transaction</b> reçu par SMS. Conservez ce code comme preuve.</div>`;
}

async function handleDeclarePayment(e){
  e.preventDefault();
  const f=new FormData(e.target);
  const data={
    membershipNumber: f.get('membershipNumber'),
    contributionTypeCode: f.get('contributionTypeCode'),
    amount: f.get('amount'),
    period: f.get('period'),
    paymentMethod: f.get('paymentMethod'),
    transactionRef: f.get('transactionRef'),
    notes: f.get('notes'),
  };
  const msg=$('#payMsg'); const btn=e.target.querySelector('button[type=submit]'); const old=btn.textContent;
  btn.disabled=true; btn.innerHTML='<span class="spinner"></span> Envoi…';
  try{
    const r=await api('/misc/declare-payment',{method:'POST',body:JSON.stringify(data)});
    msg.innerHTML=`<div class="alert alert-success">✅ ${esc(r.message)}</div>`;
    e.target.reset(); $('#payInstruction').style.display='none';
    window.scrollTo({top:0,behavior:'smooth'});
  }catch(err){
    msg.innerHTML=`<div class="alert alert-error">⚠️ ${esc(err.message)}</div>`;
  }
  btn.disabled=false; btn.textContent=old;
}

// Initialisation du carrousel d'images (page d'accueil)
function initSlider(){
  const track = $('#sliderTrack'); const dotsBox = $('#sliderDots');
  if(!track) return;
  const slides = track.children.length;
  if(sliderTimer){ clearInterval(sliderTimer); sliderTimer=null; }
  sliderIdx = 0;
  dotsBox.innerHTML = '';
  for(let i=0;i<slides;i++){
    const dot = document.createElement('button');
    dot.className = 'slider-dot' + (i===0?' active':'');
    dot.onclick = ()=>goSlide(i);
    dotsBox.appendChild(dot);
  }
  function goSlide(i){
    sliderIdx = (i+slides)%slides;
    track.style.transform = 'translateX(-'+sliderIdx*100+'%)';
    dotsBox.querySelectorAll('.slider-dot').forEach((d,k)=>d.classList.toggle('active',k===sliderIdx));
  }
  const prev=$('#sliderPrev'), next=$('#sliderNext');
  if(prev) prev.onclick=()=>{ goSlide(sliderIdx-1); resetTimer(); };
  if(next) next.onclick=()=>{ goSlide(sliderIdx+1); resetTimer(); };
  function resetTimer(){ clearInterval(sliderTimer); sliderTimer=setInterval(()=>goSlide(sliderIdx+1),5000); }
  resetTimer();
}
