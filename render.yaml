# ============================================================
#  Configuration Render "Blueprint" pour VAD
#  Ce fichier permet à Render de créer TOUT automatiquement
#  (application + base de données) en un seul clic.
# ============================================================

services:
  # ── Base de données PostgreSQL ──────────────────────────
  - type: pserv            # base PostgreSQL interne
    name: vad-database
    region: frankfurt      # plus proche de la RDC que les USA
    ip: "10.0.0.0"
    plan: free             # gratuit (90 jours sur Render)
    env: docker
    repo: null

  # ── Application Web VAD ─────────────────────────────────
  - type: web
    name: vad-asbl
    region: frankfurt
    plan: free             # plan gratuit
    env: node
    buildCommand: npm install && node deploy-setup.js
    startCommand: node src/index.js
    healthcheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vad-database
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PUBLIC_BASE_URL
        value: https://vad-asbl.onrender.com
      - key: NODE_VERSION
        value: 20.20.2
