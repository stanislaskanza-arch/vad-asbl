# ============================================================
#  Configuration Render "Blueprint" pour VAD
#  Ce fichier permet à Render de créer TOUT automatiquement
#  (application + base de données) en un seul clic.
# ============================================================

databases:
  - name: vad-database
    databaseName: vad
    user: vad_user
    region: frankfurt
    plan: free
    ipAllowList: []

services:
  # ── Application Web VAD ─────────────────────────────────
  - type: web
    name: vad-asbl
    region: frankfurt
    plan: free
    env: node
    buildCommand: npm install && node deploy-setup.js
    startCommand: node src/index.js
    healthcheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vad-database
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PUBLIC_BASE_URL
        value: https://vad-asbl.onrender.com
